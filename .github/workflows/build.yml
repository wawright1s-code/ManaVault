name: Build ManaVault APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q ManaVault.zip
      - name: Build debug APK
        working-directory: ManaVault
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: ManaVault
        run: |
          echo '## Build errors (copy this whole box into Claude)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|FAILURE|> " build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManaVault-apk
          path: ManaVault/app/build/outputs/apk/debug/app-debug.apk
